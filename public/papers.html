<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Repository | ExamVault</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="loading-screen">
        <div class="loader-logo">Exam<span>Vault</span></div>
        <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    </div>

    <nav class="navbar" id="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo">
            <div class="nav-logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <div class="nav-logo-text">Exam<span>Vault</span></div>
        </a>
        
        <div class="nav-links">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
            <a href="papers.html" class="nav-link"><i class="fa-solid fa-book-open"></i> Papers</a>
            <a href="about.html" class="nav-link"><i class="fa-solid fa-circle-info"></i> About</a>
            <a href="contact.html" class="nav-link"><i class="fa-solid fa-envelope"></i> Contact</a>
        </div>

        <div class="nav-actions">
            <button class="btn-icon" id="theme-toggle" aria-label="Toggle Adaptive Application Theme">
                <i class="fa-solid fa-moon"></i>
            </button>

            <div id="nav-profile-subsystem" style="display: flex; align-items: center; gap: 0.8rem;">
                <a href="login.html" class="btn-nav-primary" id="nav-auth-btn">Sign In</a>
            </div>

            <button class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</nav>

    <div class="mobile-menu" id="mobile-menu">
        <div class="mobile-menu-search">
            <i class="fa-solid fa-search nav-search-icon"></i>
            <input type="text" id="mobile-search-input" placeholder="Search...">
        </div>
        <a href="index.html" class="nav-link">Home</a>
        <a href="exam.html" class="nav-link">Exams</a>
        <a href="papers.html" class="nav-link active">Papers</a>
    </div>

    <main style="margin-top: 80px;">
        <div class="page-header" style="padding: 2.5rem 1.5rem;">
            <div class="page-header-content stagger">
                <div class="solution-breadcrumb">
                    <a href="exam.html">Exams</a> / <span>Repository</span>
                </div>
                <h1>Exam Question Papers</h1>
                <p>Download previous year question papers with detailed step-by-step solutions directly from the vault.</p>
            </div>
        </div>

        <section class="section">
            <div class="section-container">
                <form id="paper-search-form" class="paper-search" role="search">
                    <label class="sr-only" for="paper-search-input">Search papers</label>
                    <div class="paper-search-control">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <input id="paper-search-input" type="search" placeholder="Search by paper title, subject, or exam" autocomplete="off">
                        <button id="clear-paper-search" type="button" class="paper-search-clear" aria-label="Clear paper search" title="Clear search" hidden>
                            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                        </button>
                    </div>
                </form>

                <div class="papers-filter stagger">
                    <button class="filter-btn exam-filter active" data-exam="all">All Exams</button>
                    <button class="filter-btn exam-filter" data-exam="JEE Main">JEE Main</button>
                    <button class="filter-btn exam-filter" data-exam="NEET">NEET UG</button>
                    <button class="filter-btn exam-filter" data-exam="GATE">GATE</button>
                    <button class="filter-btn exam-filter" data-exam="UPSC">UPSC</button>
                    
                    <span style="color: var(--text-muted); padding: 0 0.5rem;">|</span>
                    
                    <button class="filter-btn year-filter active" data-year="all">All Years</button>
                    <button class="filter-btn year-filter" data-year="2025">2025</button>
                    <button class="filter-btn year-filter" data-year="2024">2024</button>
                    <button class="filter-btn year-filter" data-year="2023">2023</button>
                </div>

                <div class="papers-grid stagger" id="papers-grid">
                    </div>
            </div>
        </section>
    </main>

    <button id="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

    <footer>
        <div class="footer-container">
            <div class="footer-bottom">
                <div class="footer-copy">&copy; 2026 ExamVault. All rights reserved.</div>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/ai-assistant.js"></script>
</body>
</html>
